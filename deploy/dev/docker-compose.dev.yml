services:
  postgres:
    image: postgres:16-alpine
    container_name: a3-postgres-dev
    environment:
      POSTGRES_USER: a3
      POSTGRES_PASSWORD: a3
      POSTGRES_DB: a3_test
    ports:
      - "5433:5432"
    volumes:
      - a3_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a3 -d a3_test"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  a3_postgres_dev_data:
